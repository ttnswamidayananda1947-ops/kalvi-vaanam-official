<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalvi Vaanam</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#0d47a1;
    color:white;
}
.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}
.logo-box{
    width:40px;
    height:40px;
    border-radius:50%;
    overflow:hidden;
    background:#ffffff;
}
.logo-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.site-name{
    font-size:22px;
    font-weight:bold;
}
.menu-btn{
    font-size:26px;
    cursor:pointer;
}
.side-menu{
    position:fixed;
    top:0;
    left:-100%;
    width:250px;
    height:100%;
    background:#f5f5f5;
    box-shadow:2px 0 5px rgba(0,0,0,0.2);
    transition:0.3s;
    padding:20px;
    z-index:1000;
}
.side-menu a{
    display:block;
    margin:20px 0;
    text-decoration:none;
    color:#333;
    font-size:18px;
}
.close-btn{
    font-size:22px;
    cursor:pointer;
    text-align:right;
}
.subject-box{
    width:85%;
    max-width:400px;
    margin:30px auto;
    padding:20px;
    background:#e3f2fd;
    border:4px solid #ffffff;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    text-align:center;
}
.subject-box a{
    display:block;
    text-decoration:none;
    color:#0d47a1;
    font-size:18px;
    padding:10px 0;
    font-weight:bold;
}
.subject-box a:hover{
    text-decoration:underline;
}
.footer{
    background:#eeeeee;
    padding:60px 20px;
    text-align:center;
    margin-top:60px;
}
</style>
</head>
<body>

<div class="header">
    <div class="logo-area">
        <div class="logo-box">
            <img src="logo.png">
        </div>
        <div class="site-name" id="classTitle">Kalvi Vaanam</div>
    </div>
    <div class="menu-btn" onclick="openMenu()">☰</div>
</div>

<div class="side-menu" id="menu">
    <div class="close-btn" onclick="closeMenu()">✖</div>
    <a href="index.html">Home</a>
    <a href="mailto:ttnswamidayananda1947@gmail.com">Contact</a>
    <a href="privacy-policy.html">Privacy Policy</a>
    <a href="disclaimer.html">Disclaimer</a>
    <a href="about-us.html">About Us</a>
    <a href="terms.html">Terms & Conditions</a>
</div>

<div class="subject-box">
    <a id="tamilLink">தமிழ்</a>
    <a id="englishLink">English</a>
    <a id="mathsLink">கணிதம் (Maths)</a>
    <a id="scienceLink">அறிவியல் (Science)</a>
    <a id="socialLink">சமூக அறிவியல்</a>
</div>

<div class="footer">
    <p>© <span id="year"></span> Kalvi Vaanam</p>
</div>

<script>
function openMenu(){ document.getElementById("menu").style.left="0"; }
function closeMenu(){ document.getElementById("menu").style.left="-100%"; }

const currentYear = new Date().getFullYear();
document.getElementById("year").textContent = currentYear;

// ⭐ Dynamic Class Logic
const params = new URLSearchParams(window.location.search);
const classId = params.get("class");

// Title change
document.title = classId + "th Question Papers – Kalvi Vaanam";
document.getElementById("classTitle").innerText = "Kalvi Vaanam - " + classId + "th Class";

// Subject Links Dynamic
document.getElementById("tamilLink").href = "papers.html?class=" + classId + "&subject=tamil";
document.getElementById("englishLink").href = "papers.html?class=" + classId + "&subject=english";
document.getElementById("mathsLink").href = "papers.html?class=" + classId + "&subject=maths";
document.getElementById("scienceLink").href = "papers.html?class=" + classId + "&subject=science";
document.getElementById("socialLink").href = "papers.html?class=" + classId + "&subject=social";

</script>

</body>
</html>
