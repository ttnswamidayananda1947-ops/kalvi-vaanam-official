<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalvi Vaanam Admin</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.header{
    background:#0d47a1;
    color:white;
    padding:15px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
}

.container{
    width:95%;
    max-width:500px;
    margin:30px auto;
    padding:20px;
    background:white;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#0d47a1;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:5px;
    border-radius:5px;
}

button:hover{
    background:#1565c0;
}

.google-btn{
    background:#db4437;
}

.success-msg{
    display:none;
    background:#c8e6c9;
    color:#1b5e20;
    padding:10px;
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

.view-area{
    margin-top:15px;
    background:#f1f1f1;
    padding:10px;
    min-height:50px;
    border-radius:5px;
}

.dashboard{
    display:none;
}

@media(min-width:768px){
    .container{
        margin-top:60px;
    }
}
</style>
</head>

<body>

<div class="header">Kalvi Vaanam Admin Panel</div>

<div class="container" id="loginBox">
    <button class="google-btn" onclick="googleLogin()">Sign in with Google</button>
</div>

<div class="container dashboard" id="dashboard">

<h3>Add PDF</h3>

<select id="classSelect">
<option value="">Select Class</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
</select>

<select id="subjectSelect">
<option value="">Select Subject</option>
<option value="tamil">tamil</option>
<option value="english">english</option>
<option value="maths">maths</option>
<option value="science">science</option>
<option value="social">social</option>
<option value="physics">physics</option>
<option value="chemistry">chemistry</option>
<option value="computerscience">computerscience</option>
</select>

<input type="text" id="pdfName" placeholder="PDF Name">
<input type="text" id="pdfLink" placeholder="PDF Link">

<button onclick="addPDF()">Add PDF</button>

<div class="success-msg" id="successMsg">
PDF Added Successfully ✅
</div>

<h3>View PDFs</h3>

<select id="viewClass">
<option value="">Select Class</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
</select>

<select id="viewSubject">
<option value="">Select Subject</option>
<option value="tamil">tamil</option>
<option value="english">english</option>
<option value="maths">maths</option>
<option value="science">science</option>
<option value="social">social</option>
<option value="physics">physics</option>
<option value="chemistry">chemistry</option>
<option value="computerscience">computerscience</option>
</select>

<button onclick="viewPDFs()">View</button>

<div class="view-area" id="viewArea"></div>

<button onclick="logout()">Logout</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "kalvi-vaanam-db.firebaseapp.com",
  databaseURL: "https://kalvi-vaanam-db-default-rtdb.firebaseio.com",
  projectId: "kalvi-vaanam-db",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();

function googleLogin(){
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
}

function logout(){
    auth.signOut();
}

function addPDF(){

const classVal = document.getElementById("classSelect").value;
const subjectVal = document.getElementById("subjectSelect").value;
const name = document.getElementById("pdfName").value;
const link = document.getElementById("pdfLink").value;

if(classVal==""||subjectVal==""||name==""||link==""){
    alert("Fill all fields");
    return;
}

database.ref("classes/"+classVal+"/subjects/"+subjectVal+"/pdfs").push({
    name:name,
    link:link
}).then(()=>{
    document.getElementById("successMsg").style.display="block";
    setTimeout(()=>{
        document.getElementById("successMsg").style.display="none";
    },3000);
});
}

function viewPDFs(){

const classVal = document.getElementById("viewClass").value;
const subjectVal = document.getElementById("viewSubject").value;

const viewArea = document.getElementById("viewArea");
viewArea.innerHTML="Loading...";

database.ref("classes/"+classVal+"/subjects/"+subjectVal+"/pdfs")
.once("value",snapshot=>{
    viewArea.innerHTML="";
    snapshot.forEach(child=>{
        const data = child.val();
        viewArea.innerHTML += 
        "<p><b>"+data.name+"</b><br><a href='"+data.link+"' target='_blank'>Open PDF</a></p>";
    });
});
}

auth.onAuthStateChanged(user=>{
    if(user){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("dashboard").style.display="block";
    }else{
        document.getElementById("loginBox").style.display="block";
        document.getElementById("dashboard").style.display="none";
    }
});

</script>

</body>
</html>
