<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalvi Vaanam Admin</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
.header{background:#0d47a1;color:white;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{width:95%;max-width:500px;margin:30px auto;padding:20px;background:white;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
input,select,textarea{width:100%;padding:10px;margin:10px 0;box-sizing:border-box;}
button{width:100%;padding:10px;background:#0d47a1;color:white;border:none;cursor:pointer;margin-top:5px;border-radius:5px;}
.google-btn{background:#db4437;}
.success-msg{display:none;background:#c8e6c9;color:#1b5e20;padding:10px;margin-top:10px;text-align:center;font-weight:bold;}
.view-area{margin-top:15px;background:#f1f1f1;padding:10px;min-height:50px;border-radius:5px;}
.dashboard{display:none;}
.delete-section{margin-top:30px;border-top:2px solid #ccc;padding-top:20px;}
.delete-btn{background:#e53935;margin-top:10px;}
</style>
</head>

<body>

<div class="header">Kalvi Vaanam Admin Panel</div>

<div class="container" id="loginBox">
<button class="google-btn" onclick="googleLogin()">Sign in with Google</button>
</div>

<div class="container dashboard" id="dashboard">

<h3>Add PDF</h3>

<select id="classSelect">
<option value="">Select Class</option>
<option>6</option><option>7</option><option>8</option>
<option>9</option><option>10</option><option>11</option><option>12</option>
</select>

<select id="subjectSelect">
<option value="">Select Subject</option>
<option>tamil</option><option>english</option><option>maths</option>
<option>science</option><option>social</option>
<option>physics</option><option>chemistry</option>
<option>computerscience</option>
</select>

<input type="text" id="pdfName" placeholder="PDF Name">
<input type="text" id="pdfLink" placeholder="PDF Link">

<!-- ✅ NEW DESCRIPTION -->
<textarea id="pdfDesc" placeholder="Description (Tamil + English mix)"></textarea>

<input type="text" id="slugInput" placeholder="Slug (example: 11th-tamil-question-paper-2024)">

<button onclick="savePDF()">Save PDF</button>

<div class="success-msg" id="successMsg">Saved Successfully ✅</div>

<h3>View PDFs</h3>

<select id="viewClass"></select>
<select id="viewSubject"></select>

<button onclick="viewPDFs()">View</button>

<div class="view-area" id="viewArea"></div>

<!-- 🔥 DELETE SECTION -->
<div class="delete-section">

<h3>Delete PDF</h3>

<select id="deleteClass"></select>
<select id="deleteSubject"></select>
<select id="deletePdf"></select>

<button class="delete-btn" onclick="deletePDF()">Delete Selected PDF</button>

</div>

<button onclick="logout()">Logout</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
authDomain: "kalvi-vaanam-db.firebaseapp.com",
projectId: "kalvi-vaanam-db",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

function createSlug(text){
return text.toLowerCase()
.replace(/[^a-z0-9 ]/g,"")
.replace(/\s+/g,"-");
}

function googleLogin(){
const provider = new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

auth.onAuthStateChanged(user=>{
if(user && user.email === "ttnswamidayananda1947@gmail.com"){
loginBox.style.display="none";
dashboard.style.display="block";
}else{
loginBox.style.display="block";
dashboard.style.display="none";
}
});

function logout(){ auth.signOut(); }

function savePDF(){

const classVal = classSelect.value;
const subjectVal = subjectSelect.value;
const name = pdfName.value;
const link = pdfLink.value;
const desc = pdfDesc.value;

let slug = slugInput.value.trim();
if(!slug){
slug = createSlug(name);
}

if(!classVal || !subjectVal || !name || !link){
alert("Fill all fields");
return;
}

const ref = db.collection("classes")
.doc(classVal)
.collection("subjects")
.doc(subjectVal)
.collection("pdfs");

// ✅ SAVE WITH DESCRIPTION
ref.doc(slug).set({
name,
link,
description: desc,
slug,
createdAt:new Date()
}).then(()=>{
showSuccess();
});

pdfName.value="";
pdfLink.value="";
pdfDesc.value="";
slugInput.value="";
}

function showSuccess(){
successMsg.style.display="block";
setTimeout(()=>{successMsg.style.display="none";},2000);
}

function viewPDFs(){

const classVal = viewClass.value;
const subjectVal = viewSubject.value;
viewArea.innerHTML="Loading...";

db.collection("classes")
.doc(classVal)
.collection("subjects")
.doc(subjectVal)
.collection("pdfs")
.get()
.then(snapshot=>{

viewArea.innerHTML="";
if(snapshot.empty){ viewArea.innerHTML="No PDFs"; return; }

snapshot.forEach(doc=>{
const data = doc.data();
viewArea.innerHTML += `
<div>
<b>${data.name}</b><br>
🔗 slug: ${doc.id}<br>
<a href="${data.link}" target="_blank">Open PDF</a><br>
<hr>
</div>`;
});

});
}

// 🔥 DELETE DROPDOWN LOAD
function loadDeleteList(){

const classVal = deleteClass.value;
const subjectVal = deleteSubject.value;

const pdfSelect = document.getElementById("deletePdf");
pdfSelect.innerHTML="";

db.collection("classes")
.doc(classVal)
.collection("subjects")
.doc(subjectVal)
.collection("pdfs")
.get()
.then(snapshot=>{

snapshot.forEach(doc=>{
const option = document.createElement("option");
option.value = doc.id;
option.text = doc.data().name;
pdfSelect.appendChild(option);
});

});
}

// 🔥 DELETE FUNCTION
function deletePDF(){

const classVal = deleteClass.value;
const subjectVal = deleteSubject.value;
const slug = deletePdf.value;

if(!slug){
alert("Select PDF");
return;
}

if(!confirm("Delete this PDF?")) return;

db.collection("classes")
.doc(classVal)
.collection("subjects")
.doc(subjectVal)
.collection("pdfs")
.doc(slug)
.delete()
.then(()=>{
alert("Deleted Successfully ✅");
loadDeleteList();
});

}

// 🔥 INIT DROPDOWNS
viewClass.innerHTML = classSelect.innerHTML;
viewSubject.innerHTML = subjectSelect.innerHTML;

deleteClass.innerHTML = classSelect.innerHTML;
deleteSubject.innerHTML = subjectSelect.innerHTML;

deleteClass.onchange = loadDeleteList;
deleteSubject.onchange = loadDeleteList;

</script>

</body>
</html>
