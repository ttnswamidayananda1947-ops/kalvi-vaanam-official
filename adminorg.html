<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kalvi Vaanam Admin</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffffff;
}

.header{
    background:#0d47a1;
    color:white;
    padding:15px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.container{
    width:90%;
    max-width:400px;
    margin:40px auto;
    padding:20px;
    background:#e3f2fd;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, select{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:#0d47a1;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:5px;
}

.success-msg{
    display:none;
    background:#c8e6c9;
    color:#1b5e20;
    padding:10px;
    margin-top:10px;
    text-align:center;
    font-weight:bold;
}

.view-area{
    margin-top:15px;
    background:#ffffff;
    padding:10px;
    min-height:50px;
}

.dashboard{
    display:none;
}
</style>
</head>

<body>

<div class="header">Kalvi Vaanam Admin Panel</div>

<div class="container" id="loginBox">
    <input type="email" id="email" placeholder="Admin Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div class="container dashboard" id="dashboard">

    <h3>Add PDF</h3>

    <select id="classSelect">
        <option value="">Select Class</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
    </select>

    <select id="subjectSelect">
        <option value="">Select Subject</option>
        <option value="tamil">tamil</option>
        <option value="english">english</option>
        <option value="maths">maths</option>
        <option value="science">science</option>
        <option value="social">social</option>
        <option value="physics">physics</option>
        <option value="chemistry">chemistry</option>
        <option value="computerscience">computerscience</option>
    </select>

    <input type="text" id="pdfName" placeholder="PDF Name">
    <input type="text" id="pdfLink" placeholder="PDF Link">

    <button onclick="addPDF()">Add PDF</button>

    <div class="success-msg" id="successMsg">
        PDF Added Successfully ✅
    </div>

    <h3>View PDFs</h3>

    <select id="viewClass">
        <option value="">Select Class</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
    </select>

    <select id="viewSubject">
        <option value="">Select Subject</option>
        <option value="tamil">tamil</option>
        <option value="english">english</option>
        <option value="maths">maths</option>
        <option value="science">science</option>
        <option value="social">social</option>
        <option value="physics">physics</option>
        <option value="chemistry">chemistry</option>
        <option value="computerscience">computerscience</option>
    </select>

    <button onclick="viewPDFs()">View</button>

    <div class="view-area" id="viewArea"></div>

    <button onclick="logout()">Logout</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "kalvi-vaanam-db.firebaseapp.com",
  databaseURL: "https://kalvi-vaanam-db-default-rtdb.firebaseio.com",
  projectId: "kalvi-vaanam-db",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const database = firebase.database();

function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email,password)
    .then(()=>{
        document.getElementById("loginBox").style.display="none";
        document.getElementById("dashboard").style.display="block";
    })
    .catch(error=>{
        alert("Login Failed");
    });
}

function logout(){
    auth.signOut();
    location.reload();
}

function addPDF(){

    const classVal = document.getElementById("classSelect").value;
    const subjectVal = document.getElementById("subjectSelect").value;
    const name = document.getElementById("pdfName").value;
    const link = document.getElementById("pdfLink").value;

    if(classVal==""||subjectVal==""||name==""||link==""){
        alert("Fill all fields");
        return;
    }

    const pdfRef = database.ref("classes/"+classVal+"/subjects/"+subjectVal+"/pdfs");
    
    pdfRef.push({
        name:name,
        link:link
    }).then(()=>{
        document.getElementById("successMsg").style.display="block";
        setTimeout(()=>{ 
            document.getElementById("successMsg").style.display="none";
        },3000);
    });
}

function viewPDFs(){

    const classVal = document.getElementById("viewClass").value;
    const subjectVal = document.getElementById("viewSubject").value;

    const viewArea = document.getElementById("viewArea");
    viewArea.innerHTML="Loading...";

    database.ref("classes/"+classVal+"/subjects/"+subjectVal+"/pdfs")
    .once("value",snapshot=>{
        viewArea.innerHTML="";
        snapshot.forEach(child=>{
            const data = child.val();
            viewArea.innerHTML += 
                "<p><b>"+data.name+"</b><br><a href='"+data.link+"' target='_blank'>Open PDF</a></p>";
        });
    });
}

auth.onAuthStateChanged(user=>{
    if(user){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("dashboard").style.display="block";
    }
});

</script>

</body>
</html>
