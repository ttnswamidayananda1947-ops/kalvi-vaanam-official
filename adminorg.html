<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalvi Vaanam Admin</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;}
.header{background:#0d47a1;color:white;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{width:95%;max-width:500px;margin:30px auto;padding:20px;background:white;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
input,select{width:100%;padding:10px;margin:10px 0;box-sizing:border-box;}
button{width:100%;padding:10px;background:#0d47a1;color:white;border:none;cursor:pointer;margin-top:5px;border-radius:5px;}
.google-btn{background:#db4437;}
.success-msg{display:none;background:#c8e6c9;color:#1b5e20;padding:10px;margin-top:10px;text-align:center;font-weight:bold;}
.view-area{margin-top:15px;background:#f1f1f1;padding:10px;min-height:50px;border-radius:5px;}
.dashboard{display:none;}
.edit-btn{background:#ff9800;margin-top:5px;}
.delete-btn{background:#e53935;margin-top:5px;}
</style>
</head>

<body>

<div class="header">Kalvi Vaanam Admin Panel</div>

<div class="container" id="loginBox">
    <button class="google-btn" onclick="googleLogin()">Sign in with Google</button>
</div>

<div class="container dashboard" id="dashboard">

<h3>Add / Edit PDF</h3>

<select id="classSelect">
<option value="">Select Class</option>
<option>6</option><option>7</option><option>8</option>
<option>9</option><option>10</option><option>11</option><option>12</option>
</select>

<select id="subjectSelect">
<option value="">Select Subject</option>
<option>tamil</option><option>english</option><option>maths</option>
<option>science</option><option>social</option>
<option>physics</option><option>chemistry</option>
<option>computerscience</option>
</select>

<input type="text" id="pdfName" placeholder="PDF Name (தமிழ் / English ok)">
<input type="text" id="pdfLink" placeholder="PDF Link">

<!-- 🔥 NEW SLUG BOX -->
<input type="text" id="slugInput" placeholder="Slug (example: 11th-tamil-question-paper-2024)">

<button onclick="savePDF()">Save PDF</button>

<div class="success-msg" id="successMsg">Saved Successfully ✅</div>

<h3>View PDFs</h3>

<select id="viewClass"></select>
<select id="viewSubject"></select>

<button onclick="viewPDFs()">View</button>

<div class="view-area" id="viewArea"></div>

<button onclick="logout()">Logout</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
  authDomain: "kalvi-vaanam-db.firebaseapp.com",
  projectId: "kalvi-vaanam-db",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let editId = null;

// 🔥 fallback slug generator (only if empty)
function createSlug(text){
return text.toLowerCase()
.replace(/[^a-z0-9 ]/g,"")
.replace(/\s+/g,"-");
}

function googleLogin(){
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
}

auth.onAuthStateChanged(user=>{
    if(user && user.email === "ttnswamidayananda1947@gmail.com"){
        loginBox.style.display="none";
        dashboard.style.display="block";
    }else{
        loginBox.style.display="block";
        dashboard.style.display="none";
    }
});

function logout(){ auth.signOut(); }

function savePDF(){

const classVal = classSelect.value;
const subjectVal = subjectSelect.value;
const name = pdfName.value;
const link = pdfLink.value;

// 🔥 slug manual OR auto
let slug = slugInput.value.trim();
if(!slug){
    slug = createSlug(name);
}

if(!classVal || !subjectVal || !name || !link){
    alert("Fill all fields");
    return;
}

const seoTitle = name + " | Download PDF | Kalvi Vaanam";

const seoDesc = name + " PDF Download. " + classVal + "th " + subjectVal + " question papers Tamil Nadu board.";

const ref = db.collection("classes")
              .doc(classVal)
              .collection("subjects")
              .doc(subjectVal)
              .collection("pdfs");

if(editId){
    ref.doc(editId).update({
        name,
        link,
        slug,
        seoTitle,
        seoDesc,
        updatedAt:new Date()
    }).then(()=>{
        editId=null;
        showSuccess();
    });
}else{
    ref.add({
        name,
        link,
        slug,
        seoTitle,
        seoDesc,
        createdAt:new Date()
    }).then(()=>{
        showSuccess();
    });
}

pdfName.value="";
pdfLink.value="";
slugInput.value="";
}

function showSuccess(){
    successMsg.style.display="block";
    setTimeout(()=>{successMsg.style.display="none";},2000);
}

function viewPDFs(){

const classVal = viewClass.value;
const subjectVal = viewSubject.value;
viewArea.innerHTML="Loading...";

db.collection("classes")
  .doc(classVal)
  .collection("subjects")
  .doc(subjectVal)
  .collection("pdfs")
  .get()
  .then(snapshot=>{

    viewArea.innerHTML="";
    if(snapshot.empty){ viewArea.innerHTML="No PDFs"; return; }

    snapshot.forEach(doc=>{
        const data = doc.data();
        viewArea.innerHTML += `
        <div>
          <b>${data.name}</b><br>
          🔗 slug: ${data.slug}<br>
          <a href="${data.link}" target="_blank">Open PDF</a><br>
          <button class="edit-btn" onclick="editPDF('${doc.id}','${classVal}','${subjectVal}','${data.name}','${data.link}','${data.slug}')">✏ Edit</button>
          <button class="delete-btn" onclick="deletePDF('${doc.id}','${classVal}','${subjectVal}')">🗑 Delete</button>
          <hr>
        </div>`;
    });

  });
}

function editPDF(id,classVal,subjectVal,name,link,slug){
    editId=id;
    classSelect.value=classVal;
    subjectSelect.value=subjectVal;
    pdfName.value=name;
    pdfLink.value=link;
    slugInput.value=slug;
    window.scrollTo(0,0);
}

function deletePDF(id,classVal,subjectVal){

if(!confirm("Are you sure you want to delete this PDF?")) return;

db.collection("classes")
  .doc(classVal)
  .collection("subjects")
  .doc(subjectVal)
  .collection("pdfs")
  .doc(id)
  .delete()
  .then(()=>{
      alert("PDF Deleted Successfully ✅");
      viewPDFs();
  });
}

viewClass.innerHTML = classSelect.innerHTML;
viewSubject.innerHTML = subjectSelect.innerHTML;

</script>

</body>
</html>
