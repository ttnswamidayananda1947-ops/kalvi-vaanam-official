<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="title">Loading...</title>

<meta name="description" id="desc">
<meta name="robots" content="index, follow">

</head>

<body>

<h1 id="heading"></h1>

<p id="descText"></p>

<br><br>

<a id="downloadBtn" style="
display:inline-block;
background:#0d47a1;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
font-weight:bold;
">Download PDF</a>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
  authDomain: "kalvi-vaanam-db.firebaseapp.com",
  databaseURL: "https://kalvi-vaanam-db-default-rtdb.firebaseio.com",
  projectId: "kalvi-vaanam-db",
  storageBucket: "kalvi-vaanam-db.firebasestorage.app",
  messagingSenderId: "948342709583",
  appId: "1:948342709583:web:81a107e933185a256ab93a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ URL PARAMS
const params = new URLSearchParams(window.location.search);

const classId = params.get("class");
const subject = params.get("subject");
const id = params.get("id");

// ✅ MAIN LOAD
async function load(){

// ❗ பாதுகாப்பு check
if(!classId || !subject || !id){
document.body.innerHTML = "Invalid URL";
return;
}

// ✅ Firestore fetch
const ref = doc(db,
"classes", classId,
"subjects", subject,
"pdfs", id
);

const snap = await getDoc(ref);

if(!snap.exists()){
document.body.innerHTML = "Not Found";
return;
}

const data = snap.data();

// ✅ PDF LINK FIX (link or pdfUrl)
const pdf = data.pdfUrl || data.link;

// ✅ SEO TITLE
document.title = data.name + " | Download PDF | Kalvi Vaanam";

// ✅ HEADING
document.getElementById("heading").innerText = data.name;

// ✅ DESCRIPTION (Google முக்கியம் 🔥)
const descText = data.name + 
" PDF Download. " + classId + "th " + subject + 
" Question Papers Tamil Nadu Board. Free Study Material.";

document.getElementById("desc").setAttribute("content", descText);
document.getElementById("descText").innerText = descText;

// ✅ DOWNLOAD BUTTON
const btn = document.getElementById("downloadBtn");
btn.href = pdf;
btn.target = "_blank";

}

load();

</script>

</body>
</html>
