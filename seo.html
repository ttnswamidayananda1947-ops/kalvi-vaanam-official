<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="title">Loading...</title>

<meta name="description" id="desc">
<meta name="robots" content="index, follow">

<link rel="canonical" id="canonical">

<style>
body{
font-family:Arial;
padding:20px;
line-height:1.6;
}

h1{
color:#0d47a1;
}

.download-btn{
display:inline-block;
background:#0d47a1;
color:white;
padding:10px 20px;
text-decoration:none;
border-radius:6px;
font-weight:bold;
margin-top:15px;
}
</style>

</head>

<body>

<h1 id="heading">Loading...</h1>

<p id="descText"></p>
<p id="extraText"></p>

<br>

<a id="downloadBtn" class="download-btn">Loading...</a>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
  authDomain: "kalvi-vaanam-db.firebaseapp.com",
  projectId: "kalvi-vaanam-db",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ✅ URL PARAMS
const params = new URLSearchParams(window.location.search);

const classId = params.get("class");
const subject = params.get("subject");
const id = params.get("id");

async function load(){

// ❗ FIX: hard error remove
if(!classId || !subject || !id){
document.getElementById("heading").innerText = "Invalid Link ❌";
return;
}

try{

const ref = doc(db,
"classes", classId,
"subjects", subject,
"pdfs", id
);

const snap = await getDoc(ref);

if(!snap.exists()){
document.getElementById("heading").innerText = "PDF Not Found ❌";
return;
}

const data = snap.data();

// ✅ IMPORTANT FIX
const pdf = data.link || data.pdfUrl;

if(!pdf){
document.getElementById("heading").innerText = "PDF Link Missing ❌";
return;
}

// ✅ TITLE
const title = data.name + " | Download PDF | Kalvi Vaanam";
document.title = title;

// ✅ HEADING
document.getElementById("heading").innerText = data.name;

// ✅ DESCRIPTION
const descText = data.name + 
" PDF Download. " + classId + "th " + subject + 
" Question Papers Tamil Nadu Board.";

document.getElementById("desc").setAttribute("content", descText);
document.getElementById("descText").innerText = descText;

// ✅ EXTRA
document.getElementById("extraText").innerText =
"This PDF is useful for class " + classId + " " + subject + " students.";

// ✅ CANONICAL
document.getElementById("canonical").href = window.location.href;

// ✅ BUTTON (MAIN FIX 🔥)
const btn = document.getElementById("downloadBtn");
btn.href = pdf;
btn.target = "_blank";
btn.innerText = "Download PDF";

}catch(err){
console.log(err);
document.getElementById("heading").innerText = "Error loading data ❌";
}

}

load();

</script>

</body>
</html>
