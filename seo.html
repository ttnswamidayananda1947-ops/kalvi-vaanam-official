<!DOCTYPE html>        
<html lang="ta">        
<head>        
<meta charset="UTF-8">        
<meta name="viewport" content="width=device-width, initial-scale=1.0">        
        
<!-- ✅ DEFAULT SEO CONTENT (IMPORTANT 🔥) -->
<title id="title">Download TN Question Papers PDF | Kalvi Vaanam</title>        
        
<meta name="description" id="desc" content="Download Tamil Nadu State Board question papers, study materials, guides for classes 6 to 12. Free PDF download.">        
<meta name="robots" content="index, follow">        
        
<link rel="canonical" id="canonical" href="">        
        
<style>        
body{        
    font-family: Arial, sans-serif;        
    padding: 20px;        
    line-height: 1.6;        
    max-width: 800px;        
    margin: auto;        
    text-align: center;        
}        
        
h1{        
    color: #0d47a1;        
}        
        
.download-btn{        
    display: inline-block;        
    background: #0d47a1;        
    color: white;        
    padding: 12px 25px;        
    text-decoration: none;        
    border-radius: 6px;        
    font-weight: bold;        
    margin-top: 20px;        
    font-size: 18px;        
}        
        
#descText, #extraText {        
    color: #333;        
    font-size: 16px;        
    margin-top: 10px;        
}        
</style>        
        
</head>        
        
<body>        
        
<!-- ✅ DEFAULT CONTENT (Google Bot காக 🔥) -->
<h1 id="heading">TN State Board Question Paper Download</h1>        
        
<p id="descText">Get the latest school study materials and previous year question papers for class 6 to 12.</p>        
        
<p id="extraText">Download free PDF question papers, guides, and study materials for Tamil Nadu students.</p>        
        
<br>        
        
<a id="downloadBtn" class="download-btn">Loading PDF...</a>        
        
<script type="module">        
        
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";        
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";        
        
const firebaseConfig = {        
  apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",        
  authDomain: "kalvi-vaanam-db.firebaseapp.com",        
  projectId: "kalvi-vaanam-db",        
  storageBucket: "kalvi-vaanam-db.firebasestorage.app",        
  messagingSenderId: "948342709583",        
  appId: "1:948342709583:web:81a107e933185a256ab93a"        
};        
        
const app = initializeApp(firebaseConfig);        
const db = getFirestore(app);        
        
// ✅ URL PARAMS        
const params = new URLSearchParams(window.location.search);        
const classId = params.get("class");        
const subject = params.get("subject");        
const slugId = params.get("slug");        
        
async function load(){        
        
if(!classId || !subject || !slugId){        
    document.getElementById("heading").innerText = "Invalid Link ❌";        
    return;        
}        
        
try{        
    const ref = doc(db, "classes", classId, "subjects", subject, "pdfs", slugId);        
    const snap = await getDoc(ref);        
        
    if(!snap.exists()){        
        document.getElementById("heading").innerText = "PDF Not Found ❌";        
        return;        
    }        
        
    const data = snap.data();        
    const pdf = data.link || data.pdfUrl;        
        
    if(!pdf){        
        document.getElementById("heading").innerText = "PDF Link Missing ❌";        
        return;        
    }        
        
    // ✅ REAL SEO TITLE        
    const pageTitle = data.name + " | Download PDF | Kalvi Vaanam";        
    document.title = pageTitle;        
        
    // ✅ HEADING UPDATE        
    document.getElementById("heading").innerText = data.name;        
        
    // ✅ DESCRIPTION        
    const dText = data.name + " PDF Download. " + classId + "th " + subject + " Question Papers Tamil Nadu Board.";        
    document.getElementById("desc").setAttribute("content", dText);        
    document.getElementById("descText").innerText = dText;        
        
    // ✅ EXTRA SEO CONTENT        
    document.getElementById("extraText").innerText = 
    "This " + subject + " question paper is useful for class " + classId + " students. Download and prepare for exams easily.";        
        
    // ✅ CANONICAL        
    document.getElementById("canonical").href = window.location.origin + window.location.pathname + "?class=" + classId + "&subject=" + subject + "&slug=" + slugId;        
        
    // ✅ DOWNLOAD BUTTON        
    const btn = document.getElementById("downloadBtn");        
    btn.href = pdf;        
    btn.target = "_blank";        
    btn.innerText = "Download PDF Now";        
        
} catch(err){        
    console.log(err);        
    document.getElementById("heading").innerText = "Error loading data ❌";        
}        
}        
        
load();        
</script>        
        
</body>        
</html>
