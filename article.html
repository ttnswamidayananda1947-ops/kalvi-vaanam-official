<!DOCTYPE html>    
<html lang="ta">    
<head>    
<meta charset="UTF-8">    
<meta name="viewport" content="width=device-width, initial-scale=1.0">    
<title id="metaTitle">Loading Article... | Kalvi Vaanam</title>    
<meta name="description" id="metaDesc" content="கல்வி செய்திகள் மற்றும் பாடக்குறிப்புகளை வாசிக்கவும்.">    
    
<style>    
body{ margin:0; font-family: Arial, sans-serif; background:#ffffff; color: #333; }    
    
/* ✅ HEADER STYLE (Same as Index) */
.header{ display:flex; justify-content:space-between; align-items:center; padding:15px; background:#0d47a1; color:white; }    
.logo-area{ display:flex; align-items:center; gap:10px; }    
.logo-box{ width:40px; height:40px; border-radius:50%; overflow:hidden; background:#ffffff; }    
.logo-box img{ width:100%; height:100%; object-fit:cover; }    
.site-name{ font-size:22px; font-weight:bold; }    
.menu-btn{ font-size:26px; cursor:pointer; }    
    
/* ✅ SIDE MENU */
.side-menu{ position:fixed; top:0; left:-100%; width:250px; height:100%; background:#f5f5f5; box-shadow:2px 0 5px rgba(0,0,0,0.2); transition:0.3s; padding:20px; z-index:1000; }    
.side-menu a{ display:block; margin:20px 0; text-decoration:none; color:#333; font-size:18px; }    
.close-btn{ font-size:22px; cursor:pointer; text-align:right; }    
    
/* ✅ ARTICLE CONTENT AREA */
.article-main{ max-width: 800px; margin: 30px auto; padding: 20px; line-height: 1.8; }
.article-card{ background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.category-badge{ background: #e3f2fd; color: #0d47a1; padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; text-transform: uppercase; }
h1{ color: #0d47a1; font-size: 28px; margin-top: 15px; line-height: 1.3; }
.meta-info{ font-size: 14px; color: #777; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
#artContent{ font-size: 18px; text-align: justify; white-space: pre-wrap; word-wrap: break-word; }

/* ✅ FOOTER STYLE */
.footer{ background:#eeeeee; padding:40px 20px; text-align:center; margin-top:60px; }    
.social-icons a{ margin:0 15px; display:inline-block; }    
.social-icons img{ width:35px; height:35px; }    

/* Back Button */
.back-btn{ display: inline-block; margin-top: 20px; color: #0d47a1; text-decoration: none; font-weight: bold; border: 1px solid #0d47a1; padding: 8px 20px; border-radius: 5px; }
.back-btn:hover{ background: #0d47a1; color: #fff; }
</style>    
</head>    
    
<body>    
    
<div class="header">    
    <div class="logo-area">    
        <div class="logo-box"><img src="logo.png"></div>    
        <div class="site-name">Kalvi Vaanam</div>    
    </div>    
    <div class="menu-btn" onclick="openMenu()">☰</div>    
</div>    
    
<div class="side-menu" id="menu">    
    <div class="close-btn" onclick="closeMenu()">✖</div>    
    <a href="index.html">Home</a>    
    <a href="mailto:ttnswamidayananda1947@gmail.com">Contact</a>    
    <a href="privacy-policy.html">Privacy Policy</a>     
    <a href="about-us.html">About Us</a>    
</div>    
    
<div class="article-main">    
    <div class="article-card">
        <span class="category-badge" id="artCategory">Category</span>
        <h1 id="artHeading">கட்டுரை லோடு ஆகிறது...</h1>
        <div class="meta-info">
            பதிவேற்றியவர்: <span id="artAuthor">Kalvi Vaanam Team</span> | தேதி: <span id="artDate">...</span>
        </div>

        <div id="artContent">
            தயவுசெய்து காத்திருக்கவும்...
        </div>

        <a href="index.html" class="back-btn">← முகப்பு பக்கம்</a>
    </div>
</div>    
    
<div class="footer">    
    <div class="social-icons">    
        <a href="https://www.instagram.com/kalvi_vaanam_offical" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></a>    
        <a href="https://youtube.com/@kalvivaanam_ttnsdhss" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>    
    </div>    
    <p>© 2026 Kalvi Vaanam</p>    
</div>    
    
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
        authDomain: "kalvi-vaanam-db.firebaseapp.com",
        projectId: "kalvi-vaanam-db",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get slug from URL (?id=slug-name)
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("id");

    async function loadArticle() {
        if(!slug) {
            document.getElementById("artHeading").innerText = "கட்டுரை கிடைக்கவில்லை! ❌";
            return;
        }

        try {
            const ref = doc(db, "articles", slug);
            const snap = await getDoc(ref);

            if(snap.exists()) {
                const data = snap.data();
                
                // SEO Update
                document.title = data.title + " | Kalvi Vaanam";
                document.getElementById("metaDesc").setAttribute("content", data.title + " - முழு விவரங்களை இங்கே படிக்கவும்.");
                
                // Display Content
                document.getElementById("artHeading").innerText = data.title;
                document.getElementById("artCategory").innerText = data.category || "General";
                document.getElementById("artContent").innerText = data.content;
                
                if(data.createdAt) {
                    const date = data.createdAt.toDate();
                    document.getElementById("artDate").innerText = date.toLocaleDateString('ta-IN');
                }

            } else {
                document.getElementById("artHeading").innerText = "மன்னிக்கவும், இந்தப் பக்கம் இல்லை! ❌";
            }
        } catch(err) {
            console.error(err);
            document.getElementById("artHeading").innerText = "Error loading article ❌";
        }
    }

    loadArticle();
</script>

<script>    
function openMenu(){ document.getElementById("menu").style.left="0"; }    
function closeMenu(){ document.getElementById("menu").style.left="-100%"; }    
</script>    
    
</body>    
</html>
