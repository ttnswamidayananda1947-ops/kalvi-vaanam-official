<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalvi Vaanam Paper</title>

<!-- ⭐ SEO META -->
<meta name="description" content="Download Question Paper PDF from Kalvi Vaanam">
<meta name="robots" content="index, follow">

<style>
body{
margin:0;
font-family:Arial;
background:#fff;
}

.header{
background:#0d47a1;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
width:90%;
max-width:700px;
margin:50px auto;
text-align:center;
}

.paper-box{
background:#f5f5f5;
padding:20px;
border-radius:6px;
text-align:center;
}

.download-btn{
display:inline-block;
background:#0d47a1;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:6px;
margin-top:15px;
font-weight:bold;
font-size:16px;
}

.footer{
text-align:center;
padding:40px;
background:#eee;
margin-top:60px;
}
</style>
</head>

<body>

<div class="header" id="title">
Loading...
</div>

<div class="container" id="content"></div>

<div class="footer">
© Kalvi Vaanam
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
authDomain: "kalvi-vaanam-db.firebaseapp.com",
projectId: "kalvi-vaanam-db",
storageBucket: "kalvi-vaanam-db.firebasestorage.app",
messagingSenderId: "948342709583",
appId: "1:948342709583:web:81a107e933185a256ab93a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ⭐ URL PARAMS
const params = new URLSearchParams(window.location.search);
const classId = params.get("class");
const subject = params.get("subject");
const id = params.get("id");

async function loadPaper(){

const content = document.getElementById("content");

// ⭐ Fetch paper
const paperRef = doc(db,
"classes",classId,
"subjects",subject,
"pdfs",id);

const paperSnap = await getDoc(paperRef);

if(!paperSnap.exists()){
content.innerHTML="Paper not found";
return;
}

const data = paperSnap.data();

// ⭐ FIX link
const pdfLink = data.pdfUrl || data.link;

// ⭐ SEO Title
document.title = data.name + " | Download PDF";
document.getElementById("title").innerText = data.name;

// ⭐ FINAL OUTPUT (ONLY DOWNLOAD)
let html = `
<div class="paper-box">

<h2>${data.name}</h2>

<a class="download-btn" href="${pdfLink}" target="_blank">
Download PDF
</a>

</div>
`;

content.innerHTML = html;

}

loadPaper();

</script>

</body>
</html>
