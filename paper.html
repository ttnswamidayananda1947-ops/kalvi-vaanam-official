<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kalvi Vaanam Paper</title>

<style>
body{
margin:0;
font-family:Arial;
background:#fff;
}

.header{
background:#0d47a1;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
width:90%;
max-width:700px;
margin:20px auto;
}

.paper-box{
background:#f5f5f5;
padding:15px;
border-radius:6px;
margin-bottom:20px;
}

.download-btn{
display:inline-block;
background:#0d47a1;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:4px;
margin-top:10px;
}

.material-box{
background:#fafafa;
border:1px solid #ddd;
padding:10px;
margin-top:10px;
border-radius:4px;
display:flex;
justify-content:space-between;
align-items:center;
}

.material-box a{
background:#388e3c;
color:white;
padding:5px 10px;
text-decoration:none;
border-radius:4px;
}

iframe{
width:100%;
height:500px;
border:none;
margin-top:15px;
}

.footer{
text-align:center;
padding:40px;
background:#eee;
margin-top:40px;
}
</style>
</head>

<body>

<div class="header" id="title">
Loading...
</div>

<div class="container" id="content"></div>

<div class="footer">
© Kalvi Vaanam
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",
authDomain: "kalvi-vaanam-db.firebaseapp.com",
projectId: "kalvi-vaanam-db",
storageBucket: "kalvi-vaanam-db.firebasestorage.app",
messagingSenderId: "948342709583",
appId: "1:948342709583:web:81a107e933185a256ab93a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ⭐ URL PARAMS
const params = new URLSearchParams(window.location.search);
const classId = params.get("class");
const subject = params.get("subject");
const id = params.get("id");

document.title = classId+"th "+subject+" Question Paper";
document.getElementById("title").innerText =
classId+"th "+subject+" Question Paper";

async function loadPaper(){

const content = document.getElementById("content");

// ⭐ Paper data
const paperRef = doc(db,
"classes",classId,
"subjects",subject,
"pdfs",id);

const paperSnap = await getDoc(paperRef);

if(!paperSnap.exists()){
content.innerHTML="Paper not found";
return;
}

const data = paperSnap.data();

let html = `
<div class="paper-box">
<h3>${data.name}</h3>

<a class="download-btn" href="${data.pdfUrl}" target="_blank">
Download Question Paper
</a>

<iframe src="${data.pdfUrl}"></iframe>

<h3>Study Materials</h3>
`;

// ⭐ Materials subcollection
const matRef = collection(db,
"classes",classId,
"subjects",subject,
"pdfs",id,
"materials");

const matSnap = await getDocs(matRef);

matSnap.forEach(doc=>{
const m = doc.data();

html += `
<div class="material-box">
<span>${m.name}</span>
<a href="${m.url}" target="_blank">Download</a>
</div>
`;
});

html += `</div>`;

content.innerHTML = html;

}

loadPaper();

</script>

</body>
</html>
