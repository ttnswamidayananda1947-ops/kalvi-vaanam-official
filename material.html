<!DOCTYPE html>  
<html lang="ta">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Select Material Type | Kalvi Vaanam</title>  
  
<style>  
body { margin:0; font-family: Arial, sans-serif; background:#ffffff; }  
.header{ display:flex; justify-content:space-between; align-items:center; padding:15px; background:#0d47a1; color:white; }  
.logo-area{ display:flex; align-items:center; gap:10px; }  
.logo-box{ width:40px; height:40px; border-radius:50%; overflow:hidden; background:#ffffff; }  
.logo-box img{ width:100%; height:100%; object-fit:cover; }  
.site-name{ font-size:22px; font-weight:bold; }  
.menu-btn{ font-size:26px; cursor:pointer; }  
.side-menu{ position:fixed; top:0; left:-100%; width:250px; height:100%; background:#f5f5f5; box-shadow:2px 0 5px rgba(0,0,0,0.2); transition:0.3s; padding:20px; z-index:1000; }  
.side-menu a{ display:block; margin:20px 0; text-decoration:none; color:#333; font-size:18px; }  
.close-btn{ font-size:22px; cursor:pointer; text-align:right; }  

/* ⭐ MATERIAL SELECTION BOX (Styled like subjects page) */
.material-box{ width:90%; max-width:450px; margin:40px auto; text-align:center; }  
.material-box h2 { color: #0d47a1; font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #0d47a1; display: inline-block; padding-bottom: 5px; }

.material-btn{ 
    display:block; 
    text-decoration:none; 
    background:#ffffff; 
    color:#0d47a1; 
    font-size:18px; 
    padding:18px; 
    margin:15px 0; 
    border-radius:10px; 
    font-weight:bold; 
    border: 2px solid #0d47a1;
    transition: 0.3s; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}  
.material-btn:hover{ background:#0d47a1; color: white; transform: scale(1.02); }  
.material-btn span { display: block; font-size: 13px; font-weight: normal; margin-top: 5px; opacity: 0.8; }

.footer{ background:#eeeeee; padding:40px 20px; text-align:center; margin-top:60px; }  
</style>  
</head>  
<body>  
  
<div class="header">  
    <div class="logo-area">  
        <div class="logo-box"><img src="logo.png"></div>  
        <div class="site-name" id="pageHeader">Kalvi Vaanam</div>  
    </div>  
    <div class="menu-btn" onclick="openMenu()">☰</div>  
</div>  
  
<div class="side-menu" id="menu">  
    <div class="close-btn" onclick="closeMenu()">✖</div>  
    <a href="index.html">Home</a>  
    <a href="mailto:ttnswamidayananda1947@gmail.com">Contact</a>  
    <a href="about-us.html">About Us</a>  
</div>  
  
<div class="material-box">  
    <h2 id="infoText">Select Material Type</h2>
    
    <a href="#" id="qnBtn" class="material-btn">
        📝 Question Papers
        <span>மாதிரி மற்றும் பொதுத்தேர்வு வினாத்தாள்கள்</span>
    </a>
    
    <a href="#" id="studyBtn" class="material-btn">
        📚 Study Materials
        <span>முக்கியமான குறிப்புகள் மற்றும் கையேடுகள்</span>
    </a>

    <p style="font-size: 13px; color: #555; margin-top: 25px; font-weight: bold;" id="breadCrumb"></p>
</div>  
  
<div class="footer">  
    <p>© Kalvi Vaanam</p>  
</div>  
  
<script>  
function openMenu(){ document.getElementById("menu").style.left="0"; }  
function closeMenu(){ document.getElementById("menu").style.left="-100%"; }  
  
const params = new URLSearchParams(window.location.search);  
const classId = params.get("class");  
const subjectId = params.get("subject");  

if(classId && subjectId) {
    document.getElementById("breadCrumb").innerText = "Class: " + classId + " | Subject: " + subjectId.toUpperCase();
    
    document.getElementById("qnBtn").href = `papers.html?class=${classId}&subject=${subjectId}&type=question`;
    document.getElementById("studyBtn").href = `papers.html?class=${classId}&subject=${subjectId}&type=study`;
} else {
    window.location.href = "index.html"; 
}
</script>  
  
</body>  
</html>
