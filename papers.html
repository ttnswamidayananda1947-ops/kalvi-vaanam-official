<!DOCTYPE html>      
<html lang="ta">      
<head>      
<meta charset="UTF-8">      
<meta name="viewport" content="width=device-width, initial-scale=1.0">      
<title>Kalvi Vaanam</title>      
      
<style>      
body {      
    margin:0;      
    font-family: Arial, sans-serif;      
    background:#ffffff;      
}      
.header{      
    display:flex;      
    justify-content:space-between;      
    align-items:center;      
    padding:15px;      
    background:#0d47a1;      
    color:white;      
}      
.logo-area{      
    display:flex;      
    align-items:center;      
    gap:10px;      
}      
.logo-box{      
    width:40px;      
    height:40px;      
    border-radius:50%;      
    overflow:hidden;      
    background:#ffffff;      
}      
.logo-box img{      
    width:100%;      
    height:100%;      
    object-fit:cover;      
}      
.site-name{      
    font-size:22px;      
    font-weight:bold;      
}      
.menu-btn{      
    font-size:26px;      
    cursor:pointer;      
}      
.side-menu{      
    position:fixed;      
    top:0;      
    left:-100%;      
    width:250px;      
    height:100%;      
    background:#f5f5f5;      
    box-shadow:2px 0 5px rgba(0,0,0,0.2);      
    transition:0.3s;      
    padding:20px;      
    z-index:1000;      
}      
.side-menu a{      
    display:block;      
    margin:20px 0;      
    text-decoration:none;      
    color:#333;      
    font-size:18px;      
}      
.close-btn{      
    font-size:22px;      
    cursor:pointer;      
    text-align:right;      
}      
    
.content-area{      
    width:90%;      
    max-width:600px;      
    margin:30px auto;      
}      
    
.item-box{      
    margin-bottom:20px;      
    padding:10px 0;      
    border-bottom:1px solid #ccc;      
}      
    
.number{      
    display:inline-block;      
    background:#ff5722;      
    color:white;      
    width:25px;      
    height:25px;      
    border-radius:50%;      
    text-align:center;      
    line-height:25px;      
    margin-right:10px;      
    font-weight:bold;      
}      
    
.title-text{      
    font-size:16px;      
    color:#000;      
    font-weight:bold;      
}      
    
.download-link{      
    color:#0d47a1;      
    text-decoration:none;      
    font-weight:bold;      
}      
    
.more-btn{      
    display:block;      
    margin:20px auto;      
    padding:8px 15px;      
    background:#0d47a1;      
    color:white;      
    border:none;      
    border-radius:4px;      
    cursor:pointer;      
}      
    
.footer{      
    background:#eeeeee;      
    padding:60px 20px;      
    text-align:center;      
    margin-top:60px;      
}      
</style>      
</head>      
    
<body>      
    
<div class="header">      
    <div class="logo-area">      
        <div class="logo-box">      
            <img src="logo.png">      
        </div>      
        <div class="site-name" id="pageTitle">Kalvi Vaanam</div>      
    </div>      
    <div class="menu-btn" onclick="openMenu()">☰</div>      
</div>      
    
<div class="side-menu" id="menu">      
<div class="close-btn" onclick="closeMenu()">✖</div>      
<a href="index.html">Home</a>      
<a href="mailto:ttnswamidayananda1947@gmail.com">Contact</a>      
<a href="privacy-policy.html">Privacy Policy</a>      
<a href="disclaimer.html">Disclaimer</a>      
<a href="about-us.html">About Us</a>      
<a href="terms.html">Terms & Conditions</a>      
</div>      
    
<div class="content-area" id="content"></div>      
<button class="more-btn" id="toggleBtn" style="display:none;">More</button>      
    
<div class="footer">      
<p>© <span id="year"></span> Kalvi Vaanam</p>      
</div>      
    
<script type="module">      
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";      
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";      
    
const firebaseConfig = {      
  apiKey: "AIzaSyDADvn4P8g_Dk6fraPNk56Ansrfx5ezgJU",      
  authDomain: "kalvi-vaanam-db.firebaseapp.com",      
  projectId: "kalvi-vaanam-db",      
  storageBucket: "kalvi-vaanam-db.firebasestorage.app",      
  messagingSenderId: "948342709583",      
  appId: "1:948342709583:web:81a107e933185a256ab93a"      
};      
    
const app = initializeApp(firebaseConfig);      
const db = getFirestore(app);      
    
const params = new URLSearchParams(window.location.search);      
const classId = params.get("class");      
const subject = params.get("subject");      
    
document.title = classId + "th " + subject + " Question Papers";      
document.getElementById("pageTitle").innerText =      
"Kalvi Vaanam - " + classId + "th " + subject;      
    
let allDocs = [];      
let expanded = false;      
    
async function loadPDFs() {      
    const toggleBtn = document.getElementById("toggleBtn");      
    
    const pdfRef = collection(db,"classes",classId,"subjects",subject,"pdfs");      
    const snapshot = await getDocs(pdfRef);      
    
    allDocs = [];      
    snapshot.forEach(doc=>{      
        allDocs.push({      
            id:doc.id,      
            ...doc.data()      
        });      
    });      
    
    renderItems();      
    
    if(allDocs.length>5){      
        toggleBtn.style.display="block";      
    }      
}      
    
function renderItems(){      
    const contentDiv = document.getElementById("content");      
    const toggleBtn = document.getElementById("toggleBtn");      
    contentDiv.innerHTML="";      
    
    const itemsToShow = expanded ? allDocs : allDocs.slice(0,5);      
    
    itemsToShow.forEach((data,index)=>{      
        const div=document.createElement("div");      
        div.className="item-box";      
    
        // 🔥 slug fallback fix
        const slug = data.slug || data.name.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g,"-");
    
        div.innerHTML=`      
            <div>      
                <span class="number">${index+1}</span>      
                <span class="title-text">${data.name}</span>      
            </div>      
            <br>      
            <a class="download-link" href="seo.html?slug=${slug}">Download</a>      
        `;      
    
        contentDiv.appendChild(div);      
    });      
    
    toggleBtn.textContent = expanded ? "Show Less" : "More";      
}      
    
document.getElementById("toggleBtn").addEventListener("click",()=>{      
    expanded=!expanded;      
    renderItems();      
});      
    
loadPDFs();      
</script>      
    
<script>      
function openMenu(){ document.getElementById("menu").style.left="0"; }      
function closeMenu(){ document.getElementById("menu").style.left="-100%"; }      
document.getElementById("year").textContent=new Date().getFullYear();      
</script>      
    
</body>      
</html>
